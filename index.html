<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashing Profile Drawer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header>
    <h1>Flashing Profile Drawer</h1>
    <div class="toolbar">
      <div class="mode-group">
        <button id="modeDraw" class="mode-btn active">Draw</button>
        <button id="modeEdit" class="mode-btn">Edit</button>
        <button id="modePan" class="mode-btn">Pan</button>
      </div>
      <button id="zoomInBtn">+</button>
      <button id="zoomOutBtn">−</button>
      <button id="zoomResetBtn">Fit View</button>
      <button id="undoBtn">Undo</button>
      <button id="clearShapeBtn">Clear Shape</button>
      <button id="exportPngBtn">Export PNG</button>
      <button id="exportAllPdfBtn" class="primary">Export All (PDF)</button>
    </div>
  </header>

  <main>
    <div class="canvas-wrap">
      <canvas id="canvas" width="800" height="600"></canvas>
      <p class="hint" id="hint">Add a flashing on the right, then click the canvas to start drawing.</p>
    </div>

    <aside class="sidebar">
      <div class="panel">
        <div class="panel-header">
          <h2>Flashings</h2>
          <button id="addFlashingBtn">+ New</button>
        </div>
        <div id="flashingList" class="flashing-list"></div>
      </div>

      <div class="panel" id="detailPanel">
        <h2>Details</h2>
        <label>Name
          <input type="text" id="fName" placeholder="e.g. Apron flashing">
        </label>
        <label>Colour name
          <input type="text" id="fColourName" placeholder="e.g. Monument">
        </label>
        <label>Flashing lengths (qty/length)
          <input type="text" id="fRunLengths" placeholder="e.g. 1/3.000 2/2.450">
        </label>
        <div id="lengthsPreview" class="lengths-preview"></div>

        <div class="total">Total girth: <span id="totalGirth">0</span> mm</div>

        <table id="segTable">
          <thead>
            <tr><th>#</th><th>Length (mm)</th><th>Angle (°)</th><th></th></tr>
          </thead>
          <tbody id="segBody"></tbody>
        </table>
        <p class="empty-hint" id="segEmpty">No segments yet — draw on the canvas to add one.</p>
        <p class="note">Angle = interior angle of the bend. First segment has no bend (fixed at 0°).</p>
      </div>
    </aside>
  </main>
</div>

<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
